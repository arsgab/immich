name: Static Code Analysis
on:
  workflow_dispatch:
  pull_request:
    paths:
      - mobile/**
      - .github/workflows/static_analysis.yml
  push:
    branches:
      - main
    paths:
      - mobile/**
      - .github/workflows/static_analysis.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  mobile-dart-analyze:
    name: Run Dart Code Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06 # use-mise-action-v3.2.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ./mobile
      - name: Install dependencies
        run: mise //mobile:install:ci
      - name: Install dependencies for UI package
        run: flutter pub get --enforce-lockfile
        working-directory: ./mobile/packages/ui
      - name: Perform codegen
        run: mise //mobile:codegen
      - name: Run analyze
        run: mise //mobile:analyze --full
      - name: Run format
        run: mise //mobile:format
